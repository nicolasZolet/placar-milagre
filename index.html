<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05080c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Placar Milagre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #05080c; --panel: #0d1218; --line: #1c252f; --txt: #e8eef4; --mute: #7d8b99;
    --blue: #00B0F0; --blue-d: #003a52; --green: #19E35A; --green-d: #064d1f;
    --warn: #ffc23d; --bad: #ff5a5a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--txt);
    font-family: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation; user-select: none; -webkit-user-select: none;
    overflow: hidden; position: fixed; inset: 0; width: 100%; }
  .team, .num { overflow: hidden; }
  .num { contain: layout paint; }
  body { display: flex; flex-direction: column; height: 100dvh;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); gap: 10px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .clock { font-weight: 900; font-size: 30px; letter-spacing: .5px; font-variant-numeric: tabular-nums; }
  .title { font-weight: 800; font-size: 15px; color: var(--mute); text-transform: uppercase; letter-spacing: 2px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; font-weight: 700; font-size: 15px;
    padding: 6px 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); white-space: nowrap; }
  .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--mute); display: block; }
  .pill.ok i { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .pill.wait i { background: var(--warn); animation: blink 1s infinite; }
  .pill.bad i { background: var(--bad); }
  @keyframes blink { 50% { opacity: .25; } }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-height: 0; }
  .team { display: flex; flex-direction: column; gap: 10px; min-height: 0;
    background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 12px; }
  .name { text-align: center; font-weight: 900; font-size: clamp(18px, 3.2vh, 30px); letter-spacing: 3px; }
  .num { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 900; line-height: .8; font-size: clamp(80px, 22vh, 260px); font-variant-numeric: tabular-nums; }
  .blue .name, .blue .num { color: var(--blue); }
  .green .name, .green .num { color: var(--green); }
  button { font-family: inherit; border: 0; cursor: pointer; color: inherit; touch-action: manipulation; }
  .plus { height: clamp(90px, 24vh, 210px); border-radius: 18px; font-weight: 900;
    font-size: clamp(34px, 7vh, 64px); color: #000; transition: transform .08s, filter .08s; }
  .blue .plus { background: var(--blue); }
  .green .plus { background: var(--green); }
  .minus { height: clamp(52px, 10vh, 90px); border-radius: 16px; font-weight: 800;
    font-size: clamp(22px, 4vh, 36px); background: transparent; transition: transform .08s; }
  .blue .minus { border: 2px solid var(--blue-d); color: var(--blue); }
  .green .minus { border: 2px solid var(--green-d); color: var(--green); }
  button:active { transform: scale(.96); filter: brightness(1.15); }
  .bump { animation: bump .35s ease-out; }
  @keyframes bump { 0% { transform: scale(1.18); } 100% { transform: scale(1); } }

  footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .info { font-size: 15px; color: var(--mute); font-weight: 600; line-height: 1.15; }
  .info b { color: var(--txt); }
  .reset { padding: 14px 22px; border-radius: 14px; font-weight: 800; font-size: 19px;
    background: var(--panel); border: 1px solid var(--line); color: var(--txt); white-space: nowrap; }
  .reset.armed { background: var(--bad); border-color: var(--bad); color: #000; }

  /* bloqueio (sem link / link expirado / ainda não liberado) */
  .lock { position: fixed; inset: 0; background: rgba(5,8,12,.94); display: none; z-index: 9;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px; gap: 14px; }
  .lock.on { display: flex; }
  .lock h1 { margin: 0; font-size: 40px; font-weight: 900; }
  .lock p { margin: 0; font-size: 21px; color: var(--mute); font-weight: 600; max-width: 520px; }
  .lock .mini { font-size: 64px; font-weight: 900; letter-spacing: 2px; margin-top: 10px; }
  .lock .mini .a { color: var(--blue); } .lock .mini .b { color: var(--green); }

  @media (max-width: 420px) {
    .team { padding: 8px; border-radius: 16px; gap: 8px; }
    .title { display: none; }
    .cx { display: none; }
  }
</style>
</head>
<body>
<header>
  <div class="clock" id="clock">--:--</div>
  <div class="title">Placar · Milagre</div>
  <div class="pill wait" id="pill"><i></i><span id="pilltxt">Conectando…</span></div>
</header>

<main>
  <section class="team blue">
    <div class="name">AZUL</div>
    <div class="num" id="na">0</div>
    <button class="plus" data-op="a+">+1 GOL</button>
    <button class="minus" data-op="a-">−1<span class="cx"> corrigir</span></button>
  </section>
  <section class="team green">
    <div class="name">VERDE</div>
    <div class="num" id="nb">0</div>
    <button class="plus" data-op="b+">+1 GOL</button>
    <button class="minus" data-op="b-">−1<span class="cx"> corrigir</span></button>
  </section>
</main>

<footer>
  <div class="info" id="info"></div>
  <button class="reset" id="reset">Nova partida</button>
</footer>

<div class="lock" id="lock">
  <h1 id="lockh">Link inválido</h1>
  <p id="lockp">Peça um novo link de acesso ao responsável pelo campo.</p>
  <div class="mini"><span class="a" id="la">0</span> x <span class="b" id="lb">0</span></div>
</div>

<script>
const DB = "https://postos-smart-default-rtdb.firebaseio.com";
const URL_PLACAR = DB + "/placares/milagre/placar.json";
const URL_S = DB + "/placares/milagre/placar/s.json";

const q = new URLSearchParams(location.search);
const TOKEN = (q.get("t") || "").trim();
const INI = parseInt(q.get("i") || "0", 10) || 0;
const EXP = parseInt(q.get("e") || "0", 10) || 0;

const $ = id => document.getElementById(id);
const two = n => String(n).padStart(2, "0");
const brt = ms => { const d = new Date(ms - 3 * 3600e3); return two(d.getUTCHours()) + ":" + two(d.getUTCMinutes()); };
const brtDay = ms => { const d = new Date(ms - 3 * 3600e3); return two(d.getUTCDate()) + "/" + two(d.getUTCMonth() + 1); };
const sleep = ms => new Promise(r => setTimeout(r, ms));

let server = { a: 0, b: 0, v: 0 }, haveServer = false;
let queue = [], busy = false, blocked = false;

/* ---------- estado e exibição ---------- */
function applyOp(s, op) {
  let a = s.a, b = s.b;
  if (op === "a+") a = Math.min(99, a + 1);
  if (op === "a-") a = Math.max(0, a - 1);
  if (op === "b+") b = Math.min(99, b + 1);
  if (op === "b-") b = Math.max(0, b - 1);
  if (op === "reset") { a = 0; b = 0; }
  return { a, b };
}
let shown = { a: -1, b: -1 };
function render() {
  let s = { a: server.a, b: server.b };
  for (const op of queue) s = applyOp(s, op);
  for (const k of ["a", "b"]) {
    if (s[k] !== shown[k]) {
      const el = $("n" + k);
      el.textContent = s[k];
      if (shown[k] >= 0) { el.classList.remove("bump"); void el.offsetWidth; el.classList.add("bump"); }
    }
  }
  shown = s;
  $("la").textContent = s.a; $("lb").textContent = s.b;
  if (blocked) return;
  if (queue.length) status("wait", "Enviando ao painel…");
}
function status(kind, txt) { $("pill").className = "pill " + kind; $("pilltxt").textContent = txt; }
function fromServer(s) {
  s = s || {};
  const v = s.v || 0;
  if (haveServer && v < server.v) return;
  server = { a: s.a || 0, b: s.b || 0, v };
  haveServer = true;
  render();
}

/* ---------- envio (fila com controle de versão) ---------- */
async function req(url, opts, ms = 8000) {
  const c = new AbortController(); const t = setTimeout(() => c.abort(), ms);
  try { return await fetch(url, { ...opts, cache: "no-store", signal: c.signal }); }
  finally { clearTimeout(t); }
}
async function fetchServer() {
  const r = await req(URL_S + "?_=" + Date.now());
  if (!r.ok) throw new Error("get " + r.status);
  haveServer = false; fromServer(await r.json());
}
async function pump() {
  if (busy || !queue.length || blocked) return;
  busy = true;
  let denied = 0;
  while (queue.length && !blocked) {
    try {
      if (!haveServer) await fetchServer();
      const ns = applyOp(server, queue[0]);
      if (ns.a === server.a && ns.b === server.b && queue[0] !== "reset") { queue.shift(); render(); continue; }
      const body = { s: { a: ns.a, b: ns.b, v: server.v + 1, ts: { ".sv": "timestamp" } }, t: TOKEN };
      const r = await req(URL_PLACAR, { method: "PUT", body: JSON.stringify(body) });
      if (r.ok) {
        const j = await r.json();
        queue.shift(); denied = 0; fromServer(j.s);
        if (!queue.length) status("ok", "Painel atualizado");
      } else if (r.status === 401 || r.status === 403) {
        const before = server.v;
        await fetchServer();                       // alguém marcou ao mesmo tempo? pega o valor novo
        if (server.v === before && ++denied >= 2) { // versão igual e ainda negado = link sem permissão
          queue = []; render(); lock("expired");
        }
      } else { throw new Error("put " + r.status); }
    } catch (e) {
      status("bad", "Sem internet – tentando…");
      await sleep(1500);
    }
  }
  busy = false;
  render();
}
function act(op) {
  if (blocked) return;
  if (navigator.vibrate) navigator.vibrate(25);
  queue.push(op); render(); pump();
}

/* ---------- tempo real (stream do Firebase) ---------- */
let es = null, lastEv = 0;
function connect() {
  try { es && es.close(); } catch (e) {}
  es = new EventSource(URL_S);
  es.addEventListener("put", ev => {
    lastEv = Date.now();
    const m = JSON.parse(ev.data);
    if (m.path === "/") fromServer(m.data);
    else { const k = m.path.slice(1).split("/")[0]; fromServer({ ...server, [k]: m.data }); }
    if (!queue.length && !blocked) status("ok", "Painel conectado");
  });
  es.addEventListener("keep-alive", () => { lastEv = Date.now(); if (!queue.length && !blocked) status("ok", "Painel conectado"); });
  es.onerror = () => { if (!blocked && !queue.length) status("bad", "Sem internet – tentando…"); };
  lastEv = Date.now();
}
setInterval(() => { if (Date.now() - lastEv > 70000) connect(); }, 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { connect(); fetchServer().catch(() => {}); } });
window.addEventListener("online", () => { connect(); pump(); });

/* ---------- validade do link ---------- */
function lock(kind) {
  blocked = kind !== null;
  $("lock").classList.toggle("on", blocked);
  if (kind === "none") { $("lockh").textContent = "Somente visualização"; $("lockp").textContent = "Para alterar o placar, abra o link de acesso enviado pelo responsável do campo."; }
  if (kind === "expired") { $("lockh").textContent = "Link expirado"; $("lockp").textContent = "Este link não pode mais alterar o placar. Peça um novo link ao responsável do campo."; }
  if (kind === "early") { $("lockh").textContent = "Link ainda não liberado"; $("lockp").textContent = "Este link funciona a partir das " + brt(INI) + " (" + brtDay(INI) + "). A tela libera sozinha."; }
  if (blocked) status("bad", kind === "none" ? "Sem acesso" : kind === "early" ? "Aguardando horário" : "Link expirado");
}
function checkWindow() {
  if (!TOKEN) return lock("none");
  const now = Date.now();
  if (EXP && now > EXP) return lock("expired");
  if (INI && now < INI - 60000) return lock("early");
  if (blocked && $("lockh").textContent !== "Link expirado") { lock(null); status("ok", "Painel conectado"); }
  if (EXP) {
    const longo = EXP - now > 3 * 86400e3;
    $("info").innerHTML = longo ? "Acesso liberado" : "Link válido até <b>" + brt(EXP) + "</b>" + (brtDay(EXP) !== brtDay(now) ? " de " + brtDay(EXP) : "");
  }
}

/* ---------- relógio, botões, tela cheia ---------- */
function tick() { $("clock").textContent = brt(Date.now()); checkWindow(); }
document.querySelectorAll("[data-op]").forEach(b => b.addEventListener("click", () => act(b.dataset.op)));
let armTimer = null;
$("reset").addEventListener("click", () => {
  const b = $("reset");
  if (!b.classList.contains("armed")) {
    b.classList.add("armed"); b.textContent = "Toque de novo p/ zerar";
    clearTimeout(armTimer);
    armTimer = setTimeout(() => { b.classList.remove("armed"); b.textContent = "Nova partida"; }, 3500);
  } else {
    clearTimeout(armTimer); b.classList.remove("armed"); b.textContent = "Nova partida"; act("reset");
  }
});
let wake = null;
async function immersive() {
  try { if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen({ navigationUI: "hide" }); } catch (e) {}
  try { if ("wakeLock" in navigator && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => wake = null); } } catch (e) {}
}
document.addEventListener("pointerdown", immersive, { passive: true });
document.addEventListener("contextmenu", e => e.preventDefault());

tick(); setInterval(tick, 1000);
connect();
fetchServer().then(() => { if (!blocked) status("ok", "Painel conectado"); }).catch(() => status("bad", "Sem internet – tentando…"));
</script>
</body>
</html>
